# Nginx 部署配置模板：大模型微调技术之家
# 前端静态资源 + 后端 API 反向代理
# 使用方法：部署时将本文件内容合并到站点配置（如 /etc/nginx/conf.d/ 下）

server {
    listen       80;
    server_name  localhost;   # TODO: 修改为正式域名

    # 前端：Vue3 构建产物目录（npm run build 生成）
    root   /var/www/llmfinetunehome/Frontend/dist;
    index  index.html;

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:5000;   # 后端服务地址（与 Backend .env 中 PORT 对应）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存（可选优化）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
    }
}
